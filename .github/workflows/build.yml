name: Build

# Pull requests: lint, test and build a .dmg (downloadable from the run's artifacts).
# Pushes to main: the same, then refresh the "nightly" pre-release.
# Tags v*: the same, then publish a versioned release.
# Signing and notarization run only when the Apple secrets are configured
# (see docs/releasing.md); otherwise the .dmg is ad-hoc signed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "26.0"

jobs:
  check:
    name: Lint and test
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          [ "$(uname -m)" = arm64 ] || { echo "::error::Miiting needs an Apple Silicon runner"; exit 1; }
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          xcodebuild -version
          swift --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  package:
    name: Package .dmg
    needs: check
    runs-on: macos-26
    permissions:
      contents: write
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Version
        id: version
        run: |
          base=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' apps/macos/Resources/Info.plist)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${base}-nightly.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Import signing certificate
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # Prepend the signing keychain to the user's search list (word splitting intended).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "SIGN_ID=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build app
        run: scripts/build-app.sh

      - name: Make .dmg
        run: scripts/make-dmg.sh build/Miiting.app

      - name: Notarize
        if: env.SIGN_ID != '' && env.APPLE_API_KEY_P8_BASE64 != ''
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" scripts/notarize.sh "build/Miiting-$VERSION.dmg"
          rm "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v5
        with:
          name: Miiting-${{ steps.version.outputs.version }}
          path: build/Miiting-*.dmg
          if-no-files-found: error

      - name: Release notes
        if: github.event_name == 'push'
        run: |
          {
            echo "Requires an Apple Silicon Mac with macOS 26 or later."
            echo
            if [ -n "${SIGN_ID:-}" ]; then
              echo "Signed with a Developer ID and notarized by Apple."
            else
              echo "This build is **not notarized**. After moving Miiting to Applications, open it once from"
              echo "System Settings › Privacy & Security › *Open Anyway*, or run:"
              echo
              echo '```'
              echo 'xattr -dr com.apple.quarantine /Applications/Miiting.app'
              echo '```'
            fi
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Latest build of \`main\` ($GITHUB_SHA)."; echo; cat "$RUNNER_TEMP/notes.md"; } > "$RUNNER_TEMP/nightly.md"
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly build/Miiting-*.dmg --prerelease --target "$GITHUB_SHA" \
            --title "Nightly ($VERSION)" --notes-file "$RUNNER_TEMP/nightly.md"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Miiting-*.dmg --verify-tag \
            --title "Miiting $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
