[workspace]
resolver = "3"
members = [
    "crates/miiting-core",
    "crates/miiting-ffi",
    "tools/miiting-cli",
    "tools/uniffi-bindgen",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mrasyid22/miiting"

[workspace.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
uniffi = "0.32"
rusqlite = { version = "0.40", features = ["bundled"] }
hound = "3.5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 4
